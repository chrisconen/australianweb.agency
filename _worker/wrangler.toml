name = "awa-agent-test"
main = "agent-test.js"
compatibility_date = "2026-07-29"

# Public endpoint once deployed: https://api.australianweb.agency/agent-test (the DNS zone is on Cloudflare).
routes = [{ pattern = "api.australianweb.agency", custom_domain = true }]

# 6 tests per minute per IP; the Worker skips the check if the binding is missing.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# 120 stat events per minute per IP (page views and clicks); extra events are silently dropped.
[[ratelimits]]
name = "STATS_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# anonymous aggregate stats (no cookies, no IP, no visitor id)
[[d1_databases]]
binding = "awa_stats"
database_name = "awa-stats"
database_id = "a6497fad-adcb-4460-8dac-26c7134c4018"

# project briefs are mailed from briefs@australianweb.agency to BRIEF_TO (a verified Email Routing destination, set as a secret:
# `wrangler secret put BRIEF_TO`). Without the secret, briefs are only stored in D1.
[[send_email]]
name = "BRIEF_MAIL"
